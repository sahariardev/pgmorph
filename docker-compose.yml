services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pgmorph
      POSTGRES_PASSWORD: pgmorph
      POSTGRES_DB: pgmorph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgmorph -d pgmorph"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: